<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nyxar</title>
<style>
  :root {
    --bg: #0e1016; --card: #161924; --line: #252a39; --text: #e9ebf2; --mute: #8e96aa;
    --a1: #6d5bff; --a2: #22d3ee; --ok: #22c55e; --warn: #fb923c; --off: #5b6476;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden;
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none;
  }
  main { padding: 18px 20px 14px; max-width: 640px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; }
  header svg { width: 34px; height: 34px; }
  header b { font-size: 18px; letter-spacing: .2px; }
  header span { margin-left: auto; color: var(--mute); font-size: 12px; }

  .banner {
    display: none; align-items: center; gap: 10px; margin-top: 12px; padding: 9px 12px; border-radius: 12px;
    background: rgba(34,211,238,.1); border: 1px solid rgba(34,211,238,.35); color: #a5f3fc;
  }
  .banner span { flex: 1; }

  .hero { text-align: center; padding: 18px 0 6px; }
  #power {
    width: 132px; height: 132px; border-radius: 50%; border: 0; cursor: pointer; color: #fff;
    background: var(--off); display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 8px rgba(255,255,255,.04), 0 10px 30px rgba(0,0,0,.45);
    transition: background .25s, box-shadow .25s, transform .1s;
  }
  #power:hover { transform: scale(1.03); }
  #power:active { transform: scale(.97); }
  #power svg { width: 56px; height: 56px; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
  .st-on #power { background: linear-gradient(135deg, #22c55e, #0ea5a4); box-shadow: 0 0 0 8px rgba(34,197,94,.14), 0 10px 34px rgba(34,197,94,.3); }
  .st-error #power { background: linear-gradient(135deg, #fb923c, #ef4444); box-shadow: 0 0 0 8px rgba(251,146,60,.14), 0 10px 34px rgba(239,68,68,.25); }
  .st-connecting #power { background: linear-gradient(135deg, var(--a1), var(--a2)); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 16px rgba(109,91,255,.12), 0 10px 30px rgba(0,0,0,.45); } }

  #status { margin-top: 18px; font-size: 20px; font-weight: 600; }
  .st-on #status { color: var(--ok); }
  .st-error #status { color: var(--warn); }
  #sub { color: var(--mute); margin-top: 2px; min-height: 20px; }

  #err {
    display: none; margin: 14px 0 0; padding: 10px 12px; border-radius: 10px; font-size: 12px; text-align: left;
    background: rgba(251,146,60,.1); border: 1px solid rgba(251,146,60,.35); color: #fed7aa;
    white-space: pre-wrap; word-break: break-word; max-height: 140px; overflow: auto;
    user-select: text; -webkit-user-select: text; font-family: Consolas, monospace;
  }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 14px; }
  .hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
  .hd h3 { margin: 0; font-size: 12px; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: .6px; }
  .hd h3 em { font-style: normal; color: var(--a2); margin-left: 4px; }
  textarea {
    width: 100%; background: #0f121a; color: var(--text); border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 10px; font: inherit; outline: none; user-select: text; -webkit-user-select: text;
  }
  textarea:focus { border-color: var(--a1); }
  textarea { height: 86px; resize: vertical; font: 12px Consolas, monospace; }
  button.ghost {
    background: #0f121a; color: var(--text); border: 1px solid var(--line); border-radius: 9px;
    padding: 4px 11px; cursor: pointer; font: inherit; font-size: 13px;
  }
  button.ghost:hover:not(:disabled) { border-color: var(--a1); }
  button.ghost:disabled { opacity: .55; cursor: default; }
  button.primary {
    margin-top: 10px; width: 100%; padding: 10px; border: 0; border-radius: 10px; cursor: pointer; color: #fff;
    font: inherit; font-weight: 600; background: linear-gradient(135deg, var(--a1), var(--a2));
  }
  button.primary:hover { filter: brightness(1.08); }
  .spin { display: inline-block; animation: rot .8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  #srvlist { display: flex; flex-direction: column; gap: 4px; max-height: 250px; overflow-y: auto; }
  .srv { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
  .srv:hover { background: #1c2030; }
  .srv.sel { background: rgba(109,91,255,.12); border-color: rgba(109,91,255,.5); }
  .srv .dot { flex: none; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #4a5268; }
  .srv.sel .dot { border-color: var(--a1); background: radial-gradient(var(--a1) 0 42%, transparent 48%); }
  .srv .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srv .nm small { display: block; color: var(--mute); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
  .srv.live .nm { color: var(--ok); }
  .ms { flex: none; font-size: 12px; padding: 2px 9px; border-radius: 20px; background: #0f121a; color: var(--mute); }
  .ms.good { color: #4ade80; } .ms.mid { color: #fbbf24; } .ms.bad { color: #f87171; }
  .empty { color: var(--mute); font-size: 13px; padding: 6px 2px; }

  label.t { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; cursor: pointer; }
  label.t + label.t { border-top: 1px solid var(--line); }
  label.t small { display: block; color: var(--mute); font-size: 12px; }
  .sw { position: relative; flex: none; width: 40px; height: 22px; }
  .sw input { opacity: 0; width: 0; height: 0; position: absolute; }
  .sw i { position: absolute; inset: 0; border-radius: 22px; background: #2a3040; transition: background .2s; }
  .sw i::after { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .sw input:checked + i { background: linear-gradient(135deg, var(--a1), var(--a2)); }
  .sw input:checked + i::after { transform: translateX(18px); }

  #logcard { display: none; }
  #logbox {
    margin: 0; max-height: 230px; overflow: auto; background: #0f121a; border: 1px solid var(--line); border-radius: 9px;
    padding: 8px 10px; font: 11.5px/1.5 Consolas, monospace; color: #cbd2e1; white-space: pre-wrap; word-break: break-all;
    user-select: text; -webkit-user-select: text;
  }

  footer { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-top: 14px; color: var(--mute); font-size: 12px; }
  footer a { color: var(--a2); cursor: pointer; }
  footer a:hover { text-decoration: underline; }
  #note { flex-basis: 100%; }
</style>

<main id="app">
  <header>
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d5bff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
      <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="url(#g)"/>
      <path d="M21.4 45.8V18.2L42.6 45.8V18.2" fill="none" stroke="#fff" stroke-width="6.9" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <b>Nyxar</b>
    <span id="ver"></span>
  </header>

  <div class="banner" id="upd"><span id="updtxt"></span><button class="ghost" id="updbtn">Обновить</button></div>

  <section class="hero">
    <button id="power" aria-label="Подключить или отключить">
      <svg viewBox="0 0 24 24"><path d="M12 3v8.5"/><path d="M7 6.2a8 8 0 1 0 10 0"/></svg>
    </button>
    <div id="status">Отключено</div>
    <div id="sub"></div>
    <div id="err"></div>
  </section>

  <section class="card">
    <div class="hd">
      <h3>Серверы<em id="cnt"></em></h3>
      <button class="ghost" id="refresh" title="Обновить список и пинг" aria-label="Обновить список и пинг">↻</button>
    </div>
    <div id="srvlist"></div>
  </section>

  <section class="card">
    <div class="hd"><h3>Параметры</h3></div>
    <label class="t"><span>Россия напрямую<small>.ru, .su, .рф и местные сервисы мимо VPN</small></span>
      <span class="sw"><input type="checkbox" id="bypass_ru"><i></i></span></label>
    <label class="t"><span>Запускать с Windows<small>сворачивается в трей</small></span>
      <span class="sw"><input type="checkbox" id="autostart"><i></i></span></label>
    <label class="t"><span>Подключаться при запуске</span>
      <span class="sw"><input type="checkbox" id="autoconnect"><i></i></span></label>
    <label class="t"><span>Обновлять автоматически<small>с GitHub, когда VPN не подключён</small></span>
      <span class="sw"><input type="checkbox" id="auto_update"><i></i></span></label>
    <label class="t"><span>Подробный лог<small>для диагностики, файл быстро растёт</small></span>
      <span class="sw"><input type="checkbox" id="verbose"><i></i></span></label>
  </section>

  <section class="card">
    <div class="hd"><h3>Ссылка или подписка</h3></div>
    <textarea id="link" spellcheck="false" placeholder="vless://… или адрес подписки"></textarea>
    <button class="primary" id="save">Сохранить и подключить</button>
  </section>

  <section class="card" id="logcard">
    <div class="hd">
      <h3>Лог ядра</h3>
      <span><button class="ghost" id="logr">Обновить</button> <button class="ghost" id="logc">Копировать</button></span>
    </div>
    <pre id="logbox"></pre>
  </section>

  <footer>
    <a id="log">Показать лог</a>
    <a id="folder">Открыть папку</a>
    <a id="chk">Проверить обновления</a>
    <span id="note"></span>
  </footer>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const send = (o) => window.ipc.postMessage(JSON.stringify(o));
  let first = true;
  let cur = 'auto';

  function row(key, name, sub, ping, live) {
    const d = document.createElement('div');
    d.className = 'srv' + (key === cur ? ' sel' : '') + (live ? ' live' : '');
    const dot = document.createElement('i'); dot.className = 'dot';
    const nm = document.createElement('span'); nm.className = 'nm';
    nm.textContent = name + (live ? ' · подключено' : '');
    if (sub) { const s = document.createElement('small'); s.textContent = sub; nm.appendChild(s); }
    d.append(dot, nm);
    if (key !== 'auto') {
      const ms = document.createElement('span');
      ms.className = 'ms ' + (ping == null ? 'bad' : ping < 120 ? 'good' : ping < 300 ? 'mid' : 'bad');
      ms.textContent = ping == null ? 'нет ответа' : ping + ' мс';
      d.appendChild(ms);
    }
    d.onclick = () => { cur = key; send({ cmd: 'server', key }); document.querySelectorAll('.srv').forEach((e) => e.classList.remove('sel')); d.classList.add('sel'); };
    $('srvlist').appendChild(d);
  }

  function renderServers(s) {
    $('srvlist').innerHTML = '';
    const known = s.selected === 'auto' || s.servers.some((v) => v.key === s.selected);
    cur = known ? s.selected : 'auto';
    const best = s.servers.filter((v) => v.ping != null).sort((a, b) => a.ping - b.ping)[0];
    row('auto', 'Авто', best ? 'сейчас лучший: ' + best.name + ' · ' + best.ping + ' мс' : 'выберется по пингу при подключении');
    s.servers.forEach((v) => row(v.key, v.name, '', v.ping, v.key === s.connected_key));
    if (!s.servers.length) {
      const e = document.createElement('div'); e.className = 'empty';
      e.textContent = s.link ? (s.refreshing ? 'Загружаю список…' : 'Серверов пока нет. Проверь ссылку и нажми ↻.') : 'Добавь ссылку на подписку ниже, и серверы появятся здесь.';
      $('srvlist').appendChild(e);
    }
    $('cnt').textContent = s.servers.length ? s.servers.length : '';
    $('refresh').classList.toggle('spin', !!s.refreshing);
  }

  window.__state = function (s) {
    document.body.className = 'st-' + s.status;
    $('status').textContent = s.status_text;
    $('sub').textContent = s.sub;
    const e = $('err');
    e.style.display = s.error ? 'block' : 'none';
    e.textContent = s.error;
    renderServers(s);

    ['bypass_ru', 'autostart', 'autoconnect', 'auto_update', 'verbose'].forEach((k) => { $(k).checked = !!s[k]; });
    $('ver').textContent = 'v' + s.version;

    const u = $('upd');
    if (s.update) {
      u.style.display = 'flex';
      $('updtxt').textContent = s.update.busy ? 'Загружаю версию ' + s.update.version + '…' : 'Доступна версия ' + s.update.version;
      $('updbtn').disabled = s.update.busy;
    } else {
      u.style.display = 'none';
    }
    $('note').textContent = s.update_note || '';

    if (first || document.activeElement !== $('link')) $('link').value = s.link;
    if (first && !s.link) $('link').focus();
    first = false;
  };

  window.__log = function (t) {
    const b = $('logbox');
    b.textContent = t || 'Лог пуст: ядро ещё не запускалось или ничего не писало.';
    b.scrollTop = b.scrollHeight;
  };

  $('power').onclick = () => send({ cmd: 'toggle' });
  $('refresh').onclick = () => send({ cmd: 'refresh' });
  ['bypass_ru', 'autostart', 'autoconnect', 'auto_update', 'verbose'].forEach((k) =>
    $(k).onchange = (e) => send({ cmd: 'set', key: k, value: e.target.checked }));
  $('save').onclick = () => send({ cmd: 'save', link: $('link').value.trim() });
  $('updbtn').onclick = () => send({ cmd: 'do_update' });
  $('chk').onclick = () => send({ cmd: 'check_update' });
  $('folder').onclick = () => send({ cmd: 'folder' });
  $('logr').onclick = () => send({ cmd: 'log' });
  $('logc').onclick = () => {
    const text = $('logbox').textContent;
    const done = () => { $('logc').textContent = 'Скопировано'; setTimeout(() => $('logc').textContent = 'Копировать', 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => {});
    else { const r = document.createRange(); r.selectNodeContents($('logbox')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); done(); }
  };
  $('log').onclick = () => {
    const c = $('logcard');
    const show = c.style.display !== 'block';
    c.style.display = show ? 'block' : 'none';
    $('log').textContent = show ? 'Скрыть лог' : 'Показать лог';
    if (show) { send({ cmd: 'log' }); c.scrollIntoView({ behavior: 'smooth', block: 'end' }); }
  };
  document.addEventListener('contextmenu', (e) => { if (!/TEXTAREA|PRE/.test(e.target.tagName)) e.preventDefault(); });
  send({ cmd: 'ready' });
</script>
</html>
