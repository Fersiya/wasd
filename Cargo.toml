[package]
name = "nyxar"
version = "0.9.1"
edition = "2021"

[features]
# Единый exe: sing-box, wintun и libcronet вшиваются в сжатом виде (CI кладёт их в assets/)
embed = []

[dependencies]
flate2 = "1"
sha2 = "0.10"
tao = "0.30"
wry = "0.47"
tray-icon = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
percent-encoding = "2.3"
base64 = "0.22"
ureq = "2.10"
aes = "0.8"
ctr = "0.9"
getrandom = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

[target.'cfg(windows)'.dependencies]
notify-rust = { version = "4", default-features = false }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
