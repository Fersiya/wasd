[package]
name = "rust-light-vpn"
version = "0.2.0"
edition = "2021"

[dependencies]
tao = "0.30"
wry = "0.47"
tray-icon = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
percent-encoding = "2.3"
base64 = "0.22"
ureq = "2.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
